name: Aksi korporasi (pagi & siang)

on:
  schedule:
    - cron: "0 1 * * 1-5"         # 08:00 WIB, sebelum bursa buka
    - cron: "*/10 2-9 * * 1-5"    # mode cepat tiap 10 menit 09:00-16:50 WIB (GitHub bisa telat beberapa menit)
    - cron: "0 12 * * 0-4"        # 19:00 WIB, pengumuman yang terbit setelah bursa tutup
  workflow_dispatch:
    inputs:
      test_email:
        description: "Kirim email tes (3 aksi teratas)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Aksi korporasi (cepat tiap 10 menit, lengkap pagi & malam)
        run: |
          if [ "${{ github.event.schedule }}" = "*/10 2-9 * * 1-5" ]; then
            python corpact.py cepat
          else
            python corpact.py
          fi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          WA_TARGET: ${{ secrets.WA_TARGET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_MODEL: ${{ vars.LLM_API_MODEL }}
          # Email dimatikan 30-10-2026 (kotak masuk penuh). Untuk menyalakan lagi, tambahkan kembali
          # GMAIL_USER, GMAIL_APP_PASSWORD dan EMAIL_TO dari secrets di sini.
          EMAIL_TEST: ${{ inputs.test_email }}
      - name: Simpan data ke website
        run: |
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data data
          git commit -m "Data $(TZ=Asia/Jakarta date "+%F %H:%M")" || exit 0
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push
