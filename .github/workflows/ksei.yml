name: Komposisi KSEI (bulanan)

on:
  schedule:
    - cron: "0 2 1-12 * *"   # 09:00 WIB tanggal 1-12; KSEI menerbitkan data akhir bulan di awal bulan berikutnya
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  ksei:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python ksei.py
      - name: Simpan data ke website
        run: |
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/ksei.json
          git commit -m "KSEI $(TZ=Asia/Jakarta date "+%F")" || exit 0
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push
