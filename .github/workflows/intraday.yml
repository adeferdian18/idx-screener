name: Harga pasar (tiap 15 menit)

on:
  schedule:
    # 02:00-09:45 UTC = 09:00-16:45 WIB, Senin-Jumat. GitHub bisa telat beberapa menit.
    - cron: "*/15 2-9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python market.py
      - name: Alert breakout & stop loss (momentum)
        run: python alert.py intraday
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          WA_TARGET: ${{ secrets.WA_TARGET }}
      - name: Simpan data ke website
        run: |
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data data
          git commit -m "Data $(TZ=Asia/Jakarta date "+%F %H:%M")" || exit 0
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push
